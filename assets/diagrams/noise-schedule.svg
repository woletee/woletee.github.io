<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img"
    aria-label="Plot of how much original signal and how much noise are present at each timestep under DDPM's linear schedule. Signal falls from 1 to 0, noise rises from 0 to 1, and they cross at roughly t equals 255.">
  <style>
    .ns-ax   { stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1; }
    .ns-grid { stroke: currentColor; stroke-opacity: 0.12; stroke-width: 1; }
    .ns-tick { font: 400 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; fill-opacity: 0.6; }
    .ns-name { font: 600 13px ui-sans-serif, system-ui, sans-serif; }
    .ns-note { font: 400 12px ui-sans-serif, system-ui, sans-serif; fill: currentColor; fill-opacity: 0.72; }
    .ns-axname { font: 500 12px ui-sans-serif, system-ui, sans-serif; fill: currentColor; fill-opacity: 0.7; }
  </style>

  <g class="ns-grid">
    <line x1="70" y1="40" x2="700" y2="40" />
    <line x1="70" y1="92.5" x2="700" y2="92.5" />
    <line x1="70" y1="145" x2="700" y2="145" />
    <line x1="70" y1="197.5" x2="700" y2="197.5" />
  </g>

  <line class="ns-ax" x1="70" y1="26" x2="70" y2="250" />
  <line class="ns-ax" x1="70" y1="250" x2="710" y2="250" />

  <g class="ns-tick" text-anchor="end">
    <text x="60" y="44">1.0</text>
    <text x="60" y="149">0.5</text>
    <text x="60" y="254">0.0</text>
  </g>
  <text class="ns-axname" transform="rotate(-90 22 145)" x="22" y="145" text-anchor="middle">fraction of the mix</text>

  <g class="ns-tick" text-anchor="middle">
    <text x="70" y="270">0</text>
    <text x="194" y="270">200</text>
    <text x="318" y="270">400</text>
    <text x="443" y="270">600</text>
    <text x="567" y="270">800</text>
    <text x="690" y="270">1000</text>
  </g>
  <text class="ns-axname" x="390" y="292" text-anchor="middle">timestep t &#8594;</text>

  <line x1="228" y1="101" x2="228" y2="250" stroke="currentColor" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 4" />
  <circle cx="228" cy="101" r="3.5" fill="currentColor" fill-opacity="0.55" />
  <text class="ns-note" x="243" y="90">t &#8776; 255: half signal, half noise</text>
  <text class="ns-note" x="243" y="107">and it is downhill from there</text>

  <polyline fill="none" stroke="var(--dg-warm)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"
